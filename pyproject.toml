[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "yt-library-scraper"
version = "1.0.0"
description = "Android Termux CLI tool to extract, normalize, and merge YouTube Watch Later & Liked videos metadata."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "YouTube Library Scraper Contributors" }]
keywords = ["youtube", "scraper", "termux", "android", "metadata", "yt-dlp"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Android",
    "Environment :: Console",
]
dependencies = [
    "yt-dlp>=2024.03.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
yt-library = "scraper.cli:main"
